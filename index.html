<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Book Journal</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3ede1" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191510" />
        <script>
            // Выбранная тема применяется до отрисовки, чтобы страница не мигала другой темой
            try {
                var t = localStorage.getItem("bj-theme");
                if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
            } catch (e) {}
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
